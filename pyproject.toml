[project]
name = "obsidian-tools"
version = "0.1.0"
description = "Code for BRAIN: a git-backed Obsidian vault written to by a human and multiple AI agents"
readme = "README.md"
requires-python = ">=3.14"
# The batch producer's NATS client. Pinned exactly, and deliberately the only entry: a pure-Python
# `py3-none-any` wheel whose three declared dependencies are all optional extras (`aiohttp`,
# `nkeys`, `fast-mail-parser`), none of which this codebase requests. That matters beyond tidiness —
# the container image builds for two architectures from a single native builder stage whose virtual
# environment is copied into both (Dockerfile), an assumption any compiled extension would
# invalidate. ADR-0047 rejected NATS's decentralized JWT model on exactly this ground, because its
# client-side nonce signing pulls in `nkeys`.
dependencies = ["nats-py==2.15.0"]

[project.scripts]
obsidian-tools = "obsidian_tools.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.165.10",
  "ruff==0.16.5",
  "pyright==1.1.411",
  # Test-only: the independent oracle the frontmatter dialect (obsidian_tools/vault_schema/frontmatter.py)
  # is checked against. Never a runtime dependency -- the image is built `--no-dev` -- because its
  # compiled extension would break the one-virtualenv, two-architecture image build noted above.
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  # Real git/rsync per generated step (the crash-injection stateful harness) rather than per test
  # -- too slow for every PR's critical path. Excluded from the `test` job's ordinary run
  # (`-m "not slow"`, .github/workflows/test.yaml) and run at higher depth by the scheduled deep
  # job instead (.github/workflows/test-hypothesis-deep.yaml).
  "slow: real git/rsync-heavy tests, run out-of-band rather than on every PR",
]

[tool.ruff]
target-version = "py314"
line-length    = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "PT",  # flake8-pytest-style
  "RUF", # ruff-native rules
  "SIM", # flake8-simplify
  "TID"  # flake8-tidy-imports
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
pythonVersion    = "3.14"
typeCheckingMode = "strict"
venvPath         = "."
venv             = ".venv"
