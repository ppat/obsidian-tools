[project]
name = "obsidian-tools"
version = "0.1.0"
description = "Code for BRAIN: a git-backed Obsidian vault written to by a human and multiple AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
obsidian-tools = "obsidian_tools.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.163.0",
  "ruff==0.16.0",
  "pyright==1.1.411"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length    = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "PT",  # flake8-pytest-style
  "RUF", # ruff-native rules
  "SIM", # flake8-simplify
  "TID"  # flake8-tidy-imports
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
pythonVersion    = "3.14"
typeCheckingMode = "strict"
venvPath         = "."
venv             = ".venv"
