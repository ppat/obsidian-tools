---
# yamllint disable rule:line-length
name: build-image

# Builds on PR branches, not only on merge to main: a Harbor branch tag has to exist before merge
# so the apps repo (homelab-ops-kubernetes-apps#3443) can consume this image while its manifests
# are still being developed against a PR branch of this repo. See build-docker-image.yaml's own
# `docker/metadata-action` tag rules for the exact tag format produced (documented in this repo's
# PR description rather than duplicated here, since it's derived from that workflow, not chosen by
# this one).
on:
  pull_request:
    paths:
    - Dockerfile
    - .dockerignore
    - obsidian_tools/**
    - pyproject.toml
    - uv.lock
    - .github/workflows/build-image.yaml
  push:
    tags:
    # release-please tags releases `vX.Y.Z` (see .release-please-manifest.json) — without this, no
    # image is ever published for a released version, and the manifest's plan to track a release
    # tag instead of `branch-main` can never happen (ppat/obsidian-tools#22 review). GitHub does
    # not evaluate `paths` against a tag push (a tag is always a new ref with nothing to diff). This
    # trigger no longer includes a `main` branch push either, so the `paths` filter below currently
    # has no push event left to scope.
    - 'v*'
    paths:
    - Dockerfile
    - .dockerignore
    - obsidian_tools/**
    - pyproject.toml
    - uv.lock
    - .github/workflows/build-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    # Calls the shared reusable workflow directly rather than routing through ppat/images: this
    # repo builds its own image (the ppat/coder precedent) because it COPYs and installs its own
    # source, not a published artifact from anywhere else — see the Dockerfile's own comments.
    #
    # packages: write is scoped to this job specifically, not hoisted to the workflow-level
    # `permissions:` block above: zizmor's excessive-permissions check flags a workflow-level grant
    # as overly broad when not every job needs it (smoke-test below does not), and job-level
    # `permissions:` is exactly the mechanism GitHub Actions provides to avoid that -- it replaces
    # the workflow-level default for this job rather than adding to it.
    permissions:
      contents: read
      packages: write
    uses: ppat/github-workflows/.github/workflows/build-docker-image.yaml@c22c55c4a2764c23e5de0bd11bbb64e2ae38592b # v8.0.0 (unmerged PR #615 -- repoint to the v6.0.0 tag before merge)
    with:
      image_context_path: .
      label_title: "obsidian-tools"
      label_description: "BRAIN vault tooling: the in-cluster git committer, and future Mac-side replication CLI"
      platforms: linux/amd64,linux/arm64
      private_registry_repository: ${{ vars.CONTAINER_REGISTRY_PATH }}/obsidian-tools
      private_registry_build_cache: ${{ vars.CONTAINER_REGISTRY_CACHE_PATH }}/obsidian-tools
      git_ref: ${{ github.head_ref || github.ref }}
      timeout_minutes: 20
      # Published on EVERY build, branch and PR included — deliberately, and unlike ppat/images,
      # which keeps PR builds off Docker Hub by splitting into two workflows.
      #
      # The reason is reachability, not policy: the private registry is only reachable over
      # Tailscale, which GitHub-hosted runners do not have, and the shared chainsaw-test workflow
      # exposes no way to add it (six inputs, no secrets block) — wiring it in would mean changing
      # a workflow the whole fleet depends on. Publishing branch builds here instead means the apps
      # repo's chainsaw suite can pull `branch-<name>` and exercise this image *before* the PR
      # that produced it lands, which is the point of building on PR branches at all.
      #
      # Accepted cost: branch tags accumulate on a public repository and are not garbage-collected.
      # `latest` is unaffected — the shared workflow only sets it when a semver tag is present.
      dockerhub_repository: ppatlabs/obsidian-tools
      # Same "every build, PRs included" policy as the private registry and Docker Hub targets
      # above -- unlike ppat/images, this repo does not split PR and release builds. Unconditional
      # by deliberate choice, not oversight: see this PR's description for the storage-quota
      # tradeoff that choice carries on THIS repo specifically, because it (unlike the other two
      # GHCR targets) is private.
      ghcr_repository: ppat/obsidian-tools
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      private_registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      private_registry_token: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      private_registry: ${{ secrets.CONTAINER_REGISTRY }}
      tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

  # Pull the image that was actually published and run its entrypoint. Deliberately a separate job
  # against the artifact, not a RUN inside the Dockerfile: a build-stage check bakes a pointless
  # layer into what ships, forces the arm64 final stage through QEMU emulation just to print help
  # text, and tests the build context rather than the thing a cluster pulls.
  #
  # This exists because 0.3.0 built, published, passed every check and deployed while shipping an
  # entrypoint that could not exec -- a virtualenv shebang naming the builder's interpreter path.
  # Unit tests import the package in the runner's own environment; the build proves the image
  # builds; the consuming repo's chainsaw suite asserts the CronJob object's shape without ever
  # scheduling a pod. Three green signals, none of which answered "does it start".
  smoke-test:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    # By digest, not tag: this pins the test to exactly what this run produced rather than to a
    # moving tag another build could have overwritten in between.
    - name: Run the published entrypoint
      run: docker run --rm "docker.io/ppatlabs/obsidian-tools@${{ needs.build-image.outputs.digest }}" --help
