# Link checker config, used by the `links` job in `.github/workflows/lint.yaml`.
#
# Internal links (relative file paths and `#anchor` fragments) are the point of this
# checker: the top-level docs cross-reference each other and their own sections
# extensively, and a file rename elsewhere in the repo silently breaks both kinds. The
# `links` job runs this config in `--offline` mode on every PR that touches Markdown, so
# that check is fast, deterministic, and never fails a PR for a reason unrelated to the
# diff. Anchor checking must be turned on explicitly -- lychee ignores fragments by
# default.
include_fragments = "anchor-only"

# CHANGELOG.md is generated by release-please and is explicitly not something anyone
# hand-edits (see CLAUDE.md); its links are compare/issue/commit URLs against past
# releases and carry nothing this checker exists to catch. Matches the `!**/CHANGELOG.md`
# exclusion already used for markdown-lint in `.github/workflows/lint.yaml`.
exclude_path = ["(^|/)CHANGELOG\\.md$"]

# The settings below only take effect on the full (online) run outside pull_request
# (schedule, workflow_dispatch) -- see the `links` job for why external checking doesn't
# run on every PR. Kept modest because this repo links to a handful of external hosts,
# not the ~100+ of a survey-heavy repo.
max_retries = 3
retry_wait_time = 3
timeout = 20

# Some hosts reject HEAD but answer GET.
method = "get"

# 429 means the host is there and rate-limiting us, not a broken link, and must not fail
# the build.
accept = ["200", "202", "206", "429"]

# ppat/obsidian-vault is private by design (ADR-0029, docs/adr/replication/), and this job's
# GITHUB_TOKEN is scoped to the repository the workflow runs in -- it does not extend to
# a *different* private repo. Confirmed with the real GITHUB_TOKEN inside Actions, not
# inferred: https://github.com/ppat/obsidian-tools/actions/runs/33217007951 still 404s
# unauthenticated. Provisioning a broader-scoped token would fix it, but is disproportionate
# for one link, and this repo's Actions secrets are Terraform-managed -- not a config
# change to make from here.
#
# Excluded rather than left to fail: an unauthenticated checker cannot tell "moved or
# deleted" apart from "exists but private," so it can only be silent on this repo, never
# right about it -- and a scheduled job that's red for a reason unrelated to any change
# gets ignored, which defeats the point of adding it. Bounded to this one repository
# (prefix match covers a future link into an issue or file within it, not just the bare
# repo URL) so a real break anywhere else still fails the build.
#
# What this gives up: if ppat/obsidian-vault is ever renamed, moved, or deleted, nothing
# here will catch the resulting broken link. Re-test before removing or narrowing this --
# if the repo ever goes public, drop the exclusion so real link rot is caught again.
exclude = ["^https://github\\.com/ppat/obsidian-vault(/|$)"]
